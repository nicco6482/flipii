# Builds the weflipi Android app (android/) and publishes it as the `weflipi.apk` asset of the
# `android` release, so the download link never changes:
#   https://github.com/nicco6482/flipii/releases/download/android/weflipi.apk
#
# The app only wraps https://flipii.vercel.app, so it rarely needs rebuilding: game updates reach
# it through the web. Signing: if the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repo
# secrets exist they are used (same key for every build, so updates install over the old app);
# otherwise a fresh key is generated for this build (installing it then needs uninstalling first).
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/weflipi.jks"
            PASS="$KEYSTORE_PASSWORD"
          else
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/weflipi.jks" -alias weflipi -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=weflipi, O=nicco6482, C=ES"
          fi
          echo "::add-mask::$PASS"
          echo "WEFLIPI_KEYSTORE=$RUNNER_TEMP/weflipi.jks" >> "$GITHUB_ENV"
          echo "WEFLIPI_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "WEFLIPI_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Publish to the `android` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk weflipi.apk
          ls -la weflipi.apk
          if ! gh release view android >/dev/null 2>&1; then
            gh release create android --title "weflipi para Android" --latest=false \
              --notes "App de weflipi para Android. Descárgala desde https://flipii.vercel.app/descargar"
          fi
          gh release upload android weflipi.apk --clobber
